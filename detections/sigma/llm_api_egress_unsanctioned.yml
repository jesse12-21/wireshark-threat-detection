title: LLM API Egress from Unsanctioned Host (Atomic)
id: b4c5d6e7-f809-4a12-b3c4-d5e6f7081920
status: experimental
description: |
    Atomic rule matching outbound TLS sessions to known large-language-model
    inference API endpoints. Referenced by the volume correlation rule below
    and useful on its own for shadow-AI inventory.

    Scope note: the presence of LLM API traffic is not itself malicious. Most
    organisations now have sanctioned AI tooling. The security questions are
    which hosts are talking to which providers, whether those providers are
    approved, and how much data is leaving in the request direction.
references:
    - https://attack.mitre.org/techniques/T1567/
author: jesse12-21
date: 2026/07/29
tags:
    - attack.exfiltration
    - attack.t1567
logsource:
    product: zeek
    service: ssl
detection:
    llm_endpoints:
        server_name:
            - 'api.openai.com'
            - 'api.anthropic.com'
            - 'generativelanguage.googleapis.com'
            - 'api.mistral.ai'
            - 'api.cohere.ai'
            - 'api.together.xyz'
            - 'api.groq.com'
            - 'api.deepseek.com'
            - 'api.x.ai'
        # Regional and self-hosted inference endpoints vary by environment.
        # Extend this list from your own egress baseline rather than treating
        # it as complete.
    sanctioned_hosts:
        # Replace with the CIDR or host list approved for AI tooling in your
        # environment. An empty allowlist makes every LLM session an event.
        id.orig_h|cidr:
            - '10.20.30.0/24'
    condition: llm_endpoints and not sanctioned_hosts
fields:
    - id.orig_h
    - id.resp_h
    - server_name
level: low
