title: ECH Client Hello Without Preceding DNS HTTPS-RR Lookup (Atomic)
id: 7f0a1b2c-3d4e-4f50-8162-73849a5b6c7d
status: experimental
description: |
    Atomic rule matching TLS Client Hello messages that carry a real (non-GREASE)
    Encrypted Client Hello extension. Used as input to the correlation rule
    below. On its own this event is entirely normal — the large majority of
    modern browser traffic to CDN-fronted sites uses ECH.
references:
    - https://datatracker.ietf.org/doc/html/draft-ietf-tls-esni
author: jesse12-21
date: 2026/07/29
tags:
    - attack.command_and_control
    - attack.t1573.002
logsource:
    product: zeek
    service: ssl
detection:
    ech_present:
        # Zeek ssl.log with an ECH-aware analyzer populates this field with the
        # ClientHelloOuter's ECH config_id. Environments running an older Zeek
        # may instead need to match TLS extension type 65037 (0xFE0D) from a
        # custom analyzer script — see detections/sigma/README.md.
        ech_config_id|exists: true
    condition: ech_present
fields:
    - id.orig_h
    - id.resp_h
    - server_name
level: informational
